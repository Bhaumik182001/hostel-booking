name: CI/CD Pipeline - Test and Deploy to AWS EC2

on:
  push:
    branches: [ main ]

jobs:
  test:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: hostel_test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django Test Suite
        env:
          SECRET_KEY: ci-test-secret-key-12345
          DEBUG: '0'
          DB_NAME: hostel_test_db
          DB_USER: test_user
          DB_PASSWORD: test_password
          DB_HOST: localhost
          DB_PORT: '5432'
        run: |
          python manage.py test

  deploy:
    name: Deploy to AWS EC2
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: SSH and Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /home/${{ secrets.EC2_USER }}/hostel-booking

            echo "=== Pulling latest changes from main branch ==="
            git pull origin main

            echo "=== Building and launching production containers ==="
            docker compose -f docker-compose.prod.yml up -d --build

            echo "=== Executing database migrations ==="
            docker compose -f docker-compose.prod.yml exec -T web python manage.py migrate --noinput

            echo "=== Collecting static assets ==="
            docker compose -f docker-compose.prod.yml exec -T web python manage.py collectstatic --noinput

            echo "=== Deployment to AWS EC2 completed successfully ==="
